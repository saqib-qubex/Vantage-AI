<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&amp;display=swap');
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; }
      .date { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; }
    </style>
  </defs>
  <!-- Cream background -->
  <rect width="1200" height="675" fill="#f6f4f0"/>
  <!-- Date -->
  <text x="600" y="260" text-anchor="middle" class="date" fill="#14532d" font-size="16" letter-spacing="0.05em">AUGUST 28, 2026</text>
  <!-- Title line 1 -->
  <text x="600" y="320" text-anchor="middle" class="title" fill="#191919" font-size="48">The automated patient</text>
  <!-- Title line 2 -->
  <text x="600" y="380" text-anchor="middle" class="title" fill="#191919" font-size="48">operating system</text>
  <!-- Play button circle -->
  <circle cx="600" cy="460" r="32" fill="none" stroke="#14532d" stroke-width="2"/>
  <!-- Play triangle -->
  <polygon points="592,448 592,472 612,460" fill="#14532d"/>
</svg>
