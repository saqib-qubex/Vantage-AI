<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <title>VantageAI Personas — Meet Mira, Healix & Aria</title>
    <meta name="description" content="Interactive demo of VantageAI personas: the automated patient operating system.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Dark cinematic canvas */
            --canvas: #0f1113;
            --canvas-elevated: #1c1e20;
            --canvas-card: #2e3031;
            --canvas-border: #3a3c3e;
            
            /* Accent colors */
            --gold: #C9A227;
            --gold-glow: rgba(201, 162, 39, 0.4);
            --forest: #1a5c45;
            --forest-glow: rgba(26, 92, 69, 0.5);
            
            /* Mira palette */
            --mira-forest: #0B3D2E;
            --mira-sage: #7A8B6F;
            --mira-gold: #C9A227;
            --mira-cream: #F5F2E8;
            
            /* Healix palette */
            --healix-ink: #0E4A52;
            --healix-sky: #A8C5C9;
            --healix-white: #ffffff;
            
            /* Aria palette */
            --aria-lilac: #E8E4F0;
            --aria-plum: #4A3560;
            --aria-cream: #F7F1E8;
            
            /* Typography */
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --text-primary: #f0f2f5;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            
            /* Spacing & sizing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            
            /* Transitions */
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: var(--canvas);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Boot sequence overlay */
        .boot-overlay {
            position: fixed;
            inset: 0;
            background: var(--canvas);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.8s var(--ease-out);
        }

        .boot-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .boot-logo {
            position: relative;
        }

        .boot-logo-ring {
            width: 120px;
            height: 120px;
            border: 2px solid var(--canvas-border);
            border-radius: 50%;
            position: relative;
            animation: bootPulse 2s ease-in-out infinite;
        }

        .boot-logo-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2px solid transparent;
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: bootSpin 1.5s linear infinite;
        }

        .boot-logo-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            opacity: 0;
            animation: bootGlow 2s ease-in-out infinite;
        }

        @keyframes bootSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes bootPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes bootGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Main app container */
        .app {
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
        }

        .app.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Header bar */
        .header {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--canvas-border);
            background: rgba(15, 17, 19, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-brand a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header-brand img {
            height: 24px;
            filter: brightness(0) invert(1);
        }

        .header-badge {
            padding: 0.25rem 0.6rem;
            background: var(--canvas-elevated);
            border: 1px solid var(--canvas-border);
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
        }

        .header-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Stage area */
        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        /* Ambient background effects */
        .stage-ambient {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: ambientDrift 20s ease-in-out infinite;
        }

        .ambient-orb-1 {
            width: 400px;
            height: 400px;
            background: var(--mira-forest);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .ambient-orb-2 {
            width: 300px;
            height: 300px;
            background: var(--healix-ink);
            bottom: -50px;
            right: -50px;
            animation-delay: -7s;
        }

        .ambient-orb-3 {
            width: 250px;
            height: 250px;
            background: var(--aria-plum);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes ambientDrift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-20px, 30px) scale(0.95); }
            75% { transform: translate(-30px, -30px) scale(1.02); }
        }

        /* Character stage */
        .character-stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-spring);
            pointer-events: none;
        }

        .character-container.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .character-svg {
            width: 100%;
            height: 100%;
            max-width: 380px;
            max-height: 440px;
        }

        /* Character glow ring */
        .character-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(40px);
            animation: characterGlow 4s ease-in-out infinite;
        }

        .character-glow.mira { background: var(--mira-forest); }
        .character-glow.healix { background: var(--healix-ink); }
        .character-glow.aria { background: var(--aria-plum); }

        @keyframes characterGlow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }

        /* Working indicator */
        .working-indicator {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--canvas-elevated);
            border: 1px solid var(--canvas-border);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.3s var(--ease-out);
        }

        .working-indicator.visible {
            opacity: 1;
        }

        .working-dot {
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
            animation: workingPulse 1.5s ease-in-out infinite;
        }

        @keyframes workingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Mode rail */
        .mode-rail {
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 10;
        }

        .mode-btn {
            width: 56px;
            height: 56px;
            border: 1px solid var(--canvas-border);
            border-radius: var(--radius-md);
            background: var(--canvas-elevated);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s var(--ease-out);
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.25s var(--ease-out);
        }

        .mode-btn[data-persona="mira"]::before { background: var(--mira-forest); }
        .mode-btn[data-persona="healix"]::before { background: var(--healix-ink); }
        .mode-btn[data-persona="aria"]::before { background: var(--aria-plum); }

        .mode-btn:hover {
            border-color: var(--gold);
            transform: scale(1.05);
        }

        .mode-btn:hover::before {
            opacity: 0.2;
        }

        .mode-btn.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .mode-btn.active::before {
            opacity: 0.3;
        }

        .mode-btn-icon {
            width: 32px;
            height: 32px;
            position: relative;
            z-index: 1;
        }

        .mode-btn-key {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background: var(--canvas);
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .mode-btn.active .mode-btn-key {
            background: var(--gold);
            color: var(--canvas);
        }

        /* HUD panel */
        .hud-panel {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 360px;
            max-height: 70vh;
            background: var(--canvas-elevated);
            border: 1px solid var(--canvas-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-spring);
        }

        .hud-panel.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .hud-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--canvas-border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .hud-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .hud-title {
            flex: 1;
        }

        .hud-title h3 {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.1rem;
        }

        .hud-title span {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hud-badge {
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            animation: badgePulse 2s ease-in-out infinite;
        }

        .hud-badge.on-call {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .hud-badge.active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .hud-badge.drafting {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }

        @keyframes badgePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .hud-body {
            padding: 1rem 1.25rem;
            max-height: calc(70vh - 80px);
            overflow-y: auto;
        }

        /* Mira HUD - Call transcript */
        .call-waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 32px;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: var(--canvas);
            border-radius: var(--radius-sm);
        }

        .waveform-bar {
            width: 3px;
            height: 100%;
            background: var(--mira-gold);
            border-radius: 2px;
            animation: waveformBounce 0.8s ease-in-out infinite;
        }

        .waveform-bar:nth-child(1) { animation-delay: 0s; height: 40%; }
        .waveform-bar:nth-child(2) { animation-delay: 0.1s; height: 70%; }
        .waveform-bar:nth-child(3) { animation-delay: 0.2s; height: 100%; }
        .waveform-bar:nth-child(4) { animation-delay: 0.3s; height: 60%; }
        .waveform-bar:nth-child(5) { animation-delay: 0.4s; height: 80%; }
        .waveform-bar:nth-child(6) { animation-delay: 0.5s; height: 50%; }
        .waveform-bar:nth-child(7) { animation-delay: 0.6s; height: 90%; }
        .waveform-bar:nth-child(8) { animation-delay: 0.7s; height: 45%; }

        @keyframes waveformBounce {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        .transcript {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .transcript-turn {
            max-width: 85%;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            line-height: 1.45;
            animation: transcriptSlide 0.3s var(--ease-out);
        }

        @keyframes transcriptSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .transcript-turn.agent {
            align-self: flex-start;
            background: rgba(11, 61, 46, 0.3);
            border: 1px solid rgba(11, 61, 46, 0.5);
        }

        .transcript-turn.patient {
            align-self: flex-end;
            background: var(--canvas);
            border: 1px solid var(--canvas-border);
        }

        .transcript-who {
            display: block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-tertiary);
            margin-bottom: 0.2rem;
        }

        /* Healix HUD - Activity feed */
        .activity-feed {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--canvas);
            border: 1px solid var(--canvas-border);
            border-radius: var(--radius-md);
            animation: activitySlide 0.3s var(--ease-out);
        }

        @keyframes activitySlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-icon.chart { 
            background: rgba(14, 74, 82, 0.2); 
            color: var(--healix-sky);
        }
        .activity-icon.verify { 
            background: rgba(34, 197, 94, 0.15); 
            color: #22c55e;
        }
        .activity-icon.schedule { 
            background: rgba(99, 102, 241, 0.15); 
            color: #6366f1;
        }

        .activity-icon svg {
            width: 16px;
            height: 16px;
        }

        .activity-content {
            flex: 1;
            min-width: 0;
        }

        .activity-content strong {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }

        .activity-content span {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .activity-time {
            font-size: 0.65rem;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        /* Aria HUD - Notes panel */
        .note-section {
            margin-bottom: 1rem;
        }

        .note-section:last-child {
            margin-bottom: 0;
        }

        .note-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            margin-bottom: 0.5rem;
        }

        .note-content {
            padding: 0.75rem;
            background: var(--canvas);
            border: 1px solid var(--canvas-border);
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .note-content .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--aria-plum);
            margin-left: 2px;
            animation: cursorBlink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .artifact-preview {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--canvas);
            border: 1px solid var(--canvas-border);
            border-radius: var(--radius-md);
        }

        .artifact-icon {
            width: 36px;
            height: 36px;
            background: rgba(74, 53, 96, 0.2);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--aria-lilac);
        }

        .artifact-icon svg {
            width: 18px;
            height: 18px;
        }

        .artifact-info strong {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }

        .artifact-info span {
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }

        /* Footer */
        .footer {
            padding: 1rem 2rem;
            border-top: 1px solid var(--canvas-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            background: rgba(15, 17, 19, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .footer-tagline {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .footer-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--gold);
            color: var(--canvas);
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.25s var(--ease-out);
        }

        .footer-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--gold-glow);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .hud-panel {
                position: fixed;
                right: 1rem;
                top: auto;
                bottom: 5rem;
                transform: none;
                max-height: 50vh;
                width: calc(100% - 2rem);
                max-width: 360px;
            }
        }

        @media (max-width: 768px) {
            .mode-rail {
                position: fixed;
                left: 50%;
                top: auto;
                bottom: 5rem;
                transform: translateX(-50%) translateY(0);
                flex-direction: row;
                z-index: 100;
                background: var(--canvas-elevated);
                padding: 0.5rem;
                border-radius: var(--radius-lg);
                border: 1px solid var(--canvas-border);
            }

            .mode-btn {
                width: 48px;
                height: 48px;
            }

            .character-stage {
                max-width: 320px;
            }

            .hud-panel {
                width: calc(100% - 2rem);
                right: 1rem;
                bottom: 8rem;
            }

            .header {
                padding: 0.75rem 1rem;
            }

            .footer {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }

            .boot-overlay {
                display: none;
            }

            .app {
                opacity: 1;
                transform: none;
            }

            .character-container {
                opacity: 1;
                transform: none;
            }

            .character-container:not(.active) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Boot sequence overlay -->
    <div class="boot-overlay" id="bootOverlay">
        <div class="boot-logo">
            <div class="boot-logo-ring"></div>
            <div class="boot-logo-glow"></div>
        </div>
    </div>

    <!-- Main app -->
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <a href="../../index.html">
                    <img src="../../assets/logo.png" alt="VantageAI">
                </a>
                <span class="header-badge">Personas</span>
            </div>
            <span class="header-title">Automated Patient Operating System</span>

            { who: 'Mira', type: 'agent', text: "Good afternoon, Greenfield Family Dentistry. This is Mira, how can I help you today?" },
            { who: 'Patient', type: 'patient', text: "Hi, I need to reschedule my cleaning appointment." },
            { who: 'Mira', type: 'agent', text: "Of course! May I have your name and date of birth to pull up your appointment?" },
            { who: 'Patient', type: 'patient', text: "Sarah Johnson, March 15th, 1985." },
            { who: 'Mira', type: 'agent', text: "Thank you, Sarah. I see your cleaning is Thursday at 2 PM. Would you like to move that?" },
            { who: 'Patient', type: 'patient', text: "Yes, do you have anything Tuesday morning?" },
            { who: 'Mira', type: 'agent', text: "I have Tuesday at 9:30 AM or 11 AM. Which works better?" },
            { who: 'Patient', type: 'patient', text: "9:30 works great." },
            { who: 'Mira', type: 'agent', text: "Done! You're rescheduled to Tuesday at 9:30 AM. You'll get a confirmation text shortly." }
        ];

        const healixActivities = [
            { icon: 'chart', title: 'Updating patient chart', subtitle: 'Sarah Johnson — adding appointment notes', time: 'Just now' },
            { icon: 'verify', title: 'Coverage verified', subtitle: 'Delta Dental PPO — cleaning covered 100%', time: '2 min ago' },
            { icon: 'schedule', title: 'Recall campaign sent', subtitle: '12 patients due for 6-month checkup', time: '15 min ago' },
            { icon: 'chart', title: 'Synced with PMS', subtitle: 'Open Dental — 847 records updated', time: '32 min ago' }
        ];

        const ariaNoteText = "Patient presents for routine dental cleaning. Reports no sensitivity or discomfort since last visit. Gingival health appears stable with mild inflammation noted in lower anteriors. Discussed importance of daily flossing. Patient receptive to recommendations. Next cleaning scheduled in 6 months.";

        const workingTexts = {
            mira: "Answering calls at Greenfield Family Dentistry...",
            healix: "Updating patient records in your CRM...",
            aria: "Drafting clinical documentation..."
        };

        // State
        let activePersona = 'mira';
        let miraIndex = 0;
        let healixIndex = 0;
        let ariaCharIndex = 0;
        let miraInterval, healixInterval, ariaInterval;

        // Boot sequence
        function boot() {
            const bootOverlay = document.getElementById('bootOverlay');
            const app = document.getElementById('app');
            
            setTimeout(() => {
                bootOverlay.classList.add('fade-out');
                app.classList.add('visible');
                
                setTimeout(() => {
                    bootOverlay.style.display = 'none';
                    startMiraDemo();
                }, 800);
            }, 1800);
        }

        // Persona switching
        function switchPersona(persona) {
            if (persona === activePersona) return;
            
            // Clear intervals
            clearInterval(miraInterval);
            clearInterval(healixInterval);
            clearInterval(ariaInterval);
            
            // Update rail buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.persona === persona);
                btn.setAttribute('aria-selected', btn.dataset.persona === persona);
            });
            
            // Update character containers
            document.querySelectorAll('.character-container').forEach(container => {
                container.classList.toggle('active', container.dataset.persona === persona);
            });
            
            // Update HUD
            document.getElementById('miraHud').style.display = persona === 'mira' ? 'block' : 'none';
            document.getElementById('healixHud').style.display = persona === 'healix' ? 'block' : 'none';
            document.getElementById('ariaHud').style.display = persona === 'aria' ? 'block' : 'none';
            
            // Update working text
            document.getElementById('workingText').textContent = workingTexts[persona];
            
            activePersona = persona;
            
            // Start relevant demo
            if (persona === 'mira') {
                resetMiraDemo();
                startMiraDemo();
            } else if (persona === 'healix') {
                resetHealixDemo();
                startHealixDemo();
            } else if (persona === 'aria') {
                resetAriaDemo();
                startAriaDemo();
            }
        }

        // Mira demo
        function resetMiraDemo() {
            miraIndex = 0;
            document.getElementById('miraTranscript').innerHTML = '';
        }

        function startMiraDemo() {
            const transcript = document.getElementById('miraTranscript');
            
            function addMessage() {
                if (miraIndex < miraScript.length) {
                    const msg = miraScript[miraIndex];
                    const turn = document.createElement('div');
                    turn.className = `transcript-turn ${msg.type}`;
                    turn.innerHTML = `<span class="transcript-who">${msg.who}</span>${msg.text}`;
                    transcript.appendChild(turn);
                    transcript.scrollTop = transcript.scrollHeight;
                    miraIndex++;
                } else {
                    miraIndex = 0;
                    setTimeout(() => {
                        transcript.innerHTML = '';
                    }, 2000);
                }
            }
            
            addMessage();
            miraInterval = setInterval(addMessage, 2000);
        }

        // Healix demo
        function resetHealixDemo() {
            healixIndex = 0;
            document.getElementById('healixFeed').innerHTML = '';
        }

        function startHealixDemo() {
            const feed = document.getElementById('healixFeed');
            
            function addActivity() {
                if (healixIndex < healixActivities.length) {
                    const act = healixActivities[healixIndex];
                    const item = document.createElement('div');
                    item.className = 'activity-item';
                    
                    const iconSvg = act.icon === 'chart' 
                        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
                        : act.icon === 'verify'
                        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
                        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
                    
                    item.innerHTML = `
                        <div class="activity-icon ${act.icon}">${iconSvg}</div>
                        <div class="activity-content">
                            <strong>${act.title}</strong>
                            <span>${act.subtitle}</span>
                        </div>
                        <span class="activity-time">${act.time}</span>
                    `;
                    feed.appendChild(item);
                    healixIndex++;
                } else {
                    healixIndex = 0;
                    setTimeout(() => {
                        feed.innerHTML = '';
                    }, 2000);
                }
            }
            
            addActivity();
            healixInterval = setInterval(addActivity, 2500);
        }

        // Aria demo
        function resetAriaDemo() {
            ariaCharIndex = 0;
            document.getElementById('ariaNoteText').innerHTML = '';
        }

        function startAriaDemo() {
            const noteEl = document.getElementById('ariaNoteText');
            
            function typeNote() {
                if (ariaCharIndex <= ariaNoteText.length) {
                    noteEl.innerHTML = ariaNoteText.substring(0, ariaCharIndex) + '<span class="typing-cursor"></span>';
                    ariaCharIndex++;
                } else {
                    ariaCharIndex = 0;
                    setTimeout(() => {
                        noteEl.innerHTML = '';
                    }, 3000);
                }
            }
            
            ariaInterval = setInterval(typeNote, 40);
        }

        // Event listeners
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => switchPersona(btn.dataset.persona));
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') switchPersona('mira');
            if (e.key === '2') switchPersona('healix');
            if (e.key === '3') switchPersona('aria');
        });

        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        if (prefersReducedMotion) {
            document.getElementById('bootOverlay').style.display = 'none';
            document.getElementById('app').classList.add('visible');
            startMiraDemo();
        } else {
            boot();
        }
    </script>
</body>
</html>
