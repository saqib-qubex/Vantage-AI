<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <title>Meet the Team — VantageAI Personas Demo</title>
    <meta name="description" content="Interactive demo of VantageAI personas: Mira, Healix, and Aria.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --stage-bg: #0f1113;
            --stage-surface: #1a1d21;
            --stage-border: #2a2d32;
            --text-primary: #f0f4f8;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --gold-accent: #C9A227;
            --gold-glow: rgba(201, 162, 39, 0.3);
            
            /* Mira: forest green + cream + gold */
            --mira-primary: #22c55e;
            --mira-secondary: #f5f5dc;
            --mira-accent: #C9A227;
            --mira-glow: rgba(34, 197, 94, 0.4);
            
            /* Healix: deep teal + cyan/sky */
            --healix-primary: #0E4A52;
            --healix-secondary: #22d3ee;
            --healix-accent: #67e8f9;
            --healix-glow: rgba(34, 211, 238, 0.4);
            
            /* Aria: plum + lilac */
            --aria-primary: #7c3aed;
            --aria-secondary: #c4b5fd;
            --aria-accent: #e9d5ff;
            --aria-glow: rgba(167, 139, 250, 0.4);
            
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 28px;
            --transition-base: 250ms ease;
            --transition-slow: 600ms ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background: var(--stage-bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Header */
        .demo-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, var(--stage-bg), transparent);
        }

        .demo-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .demo-logo img {
            height: 28px;
            filter: brightness(0) invert(1);
        }

        .demo-badge {
            padding: 0.25rem 0.6rem;
            background: var(--stage-surface);
            border: 1px solid var(--gold-accent);
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gold-accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .talk-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--stage-surface);
            border: 1px solid var(--stage-border);
            border-radius: 999px;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .talk-btn:hover {
            background: var(--stage-border);
            color: var(--text-primary);
        }

        .talk-btn.active {
            background: var(--gold-accent);
            border-color: var(--gold-accent);
            color: var(--stage-bg);
        }

        /* Main Stage */
        .stage {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 4rem;
            position: relative;
        }

        /* Orb Container */
        .orb-container {
            position: relative;
            width: 420px;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb-glow {
            position: absolute;
            inset: -60px;
            border-radius: 50%;
            background: radial-gradient(circle at center, var(--mira-glow) 0%, transparent 70%);
            filter: blur(40px);
            opacity: 0.8;
            transition: background var(--transition-slow);
            pointer-events: none;
        }

        .orb-canvas {
            position: relative;
            z-index: 1;
            border-radius: 50%;
        }

        /* State HUD */
        .state-hud {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .state-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--stage-surface);
            border: 1px solid var(--stage-border);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
        }

        .state-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background var(--transition-base);
        }

        .state-chip[data-state="idle"] .state-dot { background: var(--text-muted); }
        .state-chip[data-state="listening"] .state-dot { background: #22c55e; animation: pulse-green 1.5s ease-in-out infinite; }
        .state-chip[data-state="thinking"] .state-dot { background: #f59e0b; animation: pulse-amber 1s ease-in-out infinite; }
        .state-chip[data-state="speaking"] .state-dot { background: #3b82f6; animation: pulse-blue 0.8s ease-in-out infinite; }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        }
        @keyframes pulse-amber {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
        }
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
        }

        /* Mode Rail */
        .mode-rail {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 50;
        }

        .mode-btn {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            border: 1px solid var(--stage-border);
            background: var(--stage-surface);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .mode-btn:hover {
            background: var(--stage-border);
            transform: scale(1.05);
        }

        .mode-btn.active {
            border-color: var(--gold-accent);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .mode-btn[data-mode="mira"].active { border-color: var(--mira-primary); box-shadow: 0 0 20px var(--mira-glow); }
        .mode-btn[data-mode="healix"].active { border-color: var(--healix-secondary); box-shadow: 0 0 20px var(--healix-glow); }
        .mode-btn[data-mode="aria"].active { border-color: var(--aria-primary); box-shadow: 0 0 20px var(--aria-glow); }

        .mode-key {
            font-size: 0.875rem;
            font-weight: 800;
        }

        .mode-btn[data-mode="mira"] .mode-key { color: var(--mira-primary); }
        .mode-btn[data-mode="healix"] .mode-key { color: var(--healix-secondary); }
        .mode-btn[data-mode="aria"] .mode-key { color: var(--aria-primary); }

        /* Persona Info Panel */
        .persona-panel {
            margin-top: 5rem;
            text-align: center;
            max-width: 480px;
        }

        .persona-name {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.25rem;
            transition: color var(--transition-slow);
        }

        .persona-role {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold-accent);
            margin-bottom: 1rem;
        }

        .persona-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* Product Locks HUD */
        .product-hud {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            padding: 1rem 2rem;
            background: var(--stage-surface);
            border: 1px solid var(--stage-border);
            border-radius: var(--radius-lg);
            z-index: 50;
        }

        .product-lock {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .product-lock i {
            font-size: 1rem;
        }

        .product-lock.active {
            color: var(--gold-accent);
        }

        .product-lock.active i {
            color: var(--gold-accent);
        }

        /* Footer */
        .demo-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.75rem 2rem;
            text-align: center;
            font-size: 0.6875rem;
            color: var(--text-muted);
            background: linear-gradient(to top, var(--stage-bg), transparent);
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
            .orb-canvas {
                opacity: 1 !important;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stage {
                padding: 5rem 1rem 12rem;
            }

            .orb-container {
                width: 280px;
                height: 280px;
            }

            .orb-glow {
                inset: -40px;
            }

            .state-hud {
                bottom: -50px;
            }

            .mode-rail {
                position: fixed;
                right: auto;
                left: 50%;
                top: auto;
                bottom: 2rem;
                transform: translateX(-50%);
                flex-direction: row;
                background: var(--stage-surface);
                padding: 0.5rem;
                border-radius: var(--radius-lg);
                border: 1px solid var(--stage-border);
            }

            .mode-btn {
                width: 56px;
                height: 56px;
            }

            .product-hud {
                display: none;
            }

            .persona-panel {
                margin-top: 4rem;
                padding: 0 1rem;
            }

            .persona-name {
                font-size: 1.75rem;
            }

            .persona-desc {
                font-size: 0.9rem;
            }

            .demo-footer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="demo-header">
        <a href="../../index.html" class="demo-logo">
            <img src="../../assets/logo.png" alt="VantageAI" height="28">
            <span class="demo-badge">Personas</span>
        </a>
        <div class="header-actions">
            <button class="talk-btn" id="talkBtn" title="Enable microphone for live amplitude">
                <i class="fas fa-microphone"></i>
                <span>Talk</span>
            </button>
        </div>
    </header>

    <main class="stage">
        <div class="orb-container">
            <div class="orb-glow" id="orbGlow"></div>
            <canvas class="orb-canvas" id="orbCanvas" width="350" height="350"></canvas>
            <div class="state-hud">
                <div class="state-chip" id="stateChip" data-state="idle">
                    <span class="state-dot"></span>
                    <span class="state-label">Idle</span>
                </div>
            </div>
        </div>

        <section class="persona-panel">
            <h1 class="persona-name" id="personaName">Mira</h1>
            <p class="persona-role" id="personaRole">Front-Desk Voice</p>
            <p class="persona-desc" id="personaDesc">Answers every call 24/7, identifies patients, and books appointments directly on the chart. Your always-on front desk.</p>
        </section>
    </main>

    <nav class="mode-rail">
        <button class="mode-btn active" data-mode="mira" title="Mira — Front-Desk Voice (Press 1)">
            <span class="mode-key">1</span>
            <span>Mira</span>
        </button>
        <button class="mode-btn" data-mode="healix" title="Healix — In-CRM Agent (Press 2)">
            <span class="mode-key">2</span>
            <span>Healix</span>
        </button>
        <button class="mode-btn" data-mode="aria" title="Aria — AI Scribe (Press 3)">
            <span class="mode-key">3</span>
            <span>Aria</span>
        </button>
    </nav>

    <div class="product-hud">
        <div class="product-lock active" data-product="voice">
            <i class="fas fa-phone-volume"></i>
            <span>Voice</span>
        </div>
        <div class="product-lock" data-product="crm">
            <i class="fas fa-database"></i>
            <span>CRM</span>
        </div>
        <div class="product-lock" data-product="scribe">
            <i class="fas fa-file-medical"></i>
            <span>Scribe</span>
        </div>
    </div>

    <footer class="demo-footer">
        Internal demo · Not for public distribution · VantageAI by QubeX, Inc.
    </footer>

    <script>
    (function() {
        'use strict';

        // Persona definitions
        const personas = {
            mira: {
                name: 'Mira',
                role: 'Front-Desk Voice',
                desc: 'Answers every call 24/7, identifies patients, and books appointments directly on the chart. Your always-on front desk.',
                colors: {
                    primary: [34, 197, 94],      // green
                    secondary: [245, 245, 220],  // cream
                    accent: [201, 162, 39],      // gold
                    glow: 'rgba(34, 197, 94, 0.4)'
                },
                product: 'voice'
            },
            healix: {
                name: 'Healix',
                role: 'In-CRM Agent',
                desc: 'Works inside your CRM—updates charts, verifies coverage, and runs admin tasks automatically. Non-clinical automation.',
                colors: {
                    primary: [14, 74, 82],       // deep teal
                    secondary: [34, 211, 238],   // cyan
                    accent: [103, 232, 249],     // sky
                    glow: 'rgba(34, 211, 238, 0.4)'
                },
                product: 'crm'
            },
            aria: {
                name: 'Aria',
                role: 'Clinical Scribe',
                desc: 'Listens during visits, captures clinical notes, and drafts documentation—no typing required. HIPAA-aware transcription.',
                colors: {
                    primary: [124, 58, 237],     // plum
                    secondary: [196, 181, 253],  // lilac
                    accent: [233, 213, 255],     // light lavender
                    glow: 'rgba(167, 139, 250, 0.4)'
                },
                product: 'scribe'
            }
        };

        // State definitions
        const states = ['idle', 'listening', 'thinking', 'speaking'];
        const stateLabels = {
            idle: 'Idle',
            listening: 'Listening',
            thinking: 'Thinking',
            speaking: 'Speaking'
        };

        // Current state
        let currentPersona = 'mira';
        let currentState = 'idle';
        let targetColors = { ...personas.mira.colors };
        let currentColors = {
            primary: [...personas.mira.colors.primary],
            secondary: [...personas.mira.colors.secondary],
            accent: [...personas.mira.colors.accent]
        };

        // Animation state
        let animationId = null;
        let time = 0;
        let amplitude = 0;
        let targetAmplitude = 0;
        let stateTimer = 0;
        let stateCycleDuration = 4000; // ms per state in demo cycle

        // Audio state
        let audioContext = null;
        let analyser = null;
        let micStream = null;
        let useMic = false;

        // DOM elements
        const canvas = document.getElementById('orbCanvas');
        const ctx = canvas.getContext('2d');
        const orbGlow = document.getElementById('orbGlow');
        const stateChip = document.getElementById('stateChip');
        const personaName = document.getElementById('personaName');
        const personaRole = document.getElementById('personaRole');
        const personaDesc = document.getElementById('personaDesc');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const productLocks = document.querySelectorAll('.product-lock');
        const talkBtn = document.getElementById('talkBtn');

        // High DPI canvas setup
        const dpr = window.devicePixelRatio || 1;
        const size = 350;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        ctx.scale(dpr, dpr);

        // Check reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Lerp helper
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        // Lerp color arrays
        function lerpColor(c1, c2, t) {
            return [
                Math.round(lerp(c1[0], c2[0], t)),
                Math.round(lerp(c1[1], c2[1], t)),
                Math.round(lerp(c1[2], c2[2], t))
            ];
        }

        // RGB to CSS
        function rgb(c, a = 1) {
            return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
        }

        // Generate simulated amplitude based on state
        function getSimulatedAmplitude(state, t) {
            switch (state) {
                case 'idle':
                    return 0.15 + 0.05 * Math.sin(t * 0.5);
                case 'listening':
                    return 0.25 + 0.15 * Math.sin(t * 2) + 0.1 * Math.sin(t * 5.3);
                case 'thinking':
                    return 0.35 + 0.2 * Math.sin(t * 3) * Math.sin(t * 0.7);
                case 'speaking':
                    return 0.5 + 0.3 * Math.abs(Math.sin(t * 4)) * Math.sin(t * 8.7) + 0.15 * Math.sin(t * 12);
                default:
                    return 0.2;
            }
        }

        // Get microphone amplitude
        function getMicAmplitude() {
            if (!analyser) return 0;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            return (sum / dataArray.length) / 255;
        }

        // Draw the Siri-style orb
        function drawOrb(timestamp) {
            const dt = 1 / 60;
            time += dt;

            // Update colors with smooth interpolation
            const colorLerpSpeed = 0.05;
            currentColors.primary = lerpColor(currentColors.primary, targetColors.primary, colorLerpSpeed);
            currentColors.secondary = lerpColor(currentColors.secondary, targetColors.secondary, colorLerpSpeed);
            currentColors.accent = lerpColor(currentColors.accent, targetColors.accent, colorLerpSpeed);

            // Get amplitude
            if (useMic && analyser) {
                targetAmplitude = getMicAmplitude();
            } else {
                targetAmplitude = getSimulatedAmplitude(currentState, time);
            }
            amplitude = lerp(amplitude, targetAmplitude, 0.1);

            // Clear canvas
            ctx.clearRect(0, 0, size, size);

            const cx = size / 2;
            const cy = size / 2;
            const baseRadius = size * 0.38;

            // Breathing effect
            const breathe = 1 + 0.03 * Math.sin(time * 0.8);

            // Morph factor based on amplitude
            const morphIntensity = amplitude * 0.15;

            // Draw multiple layers for depth
            const layers = 5;
            for (let layer = layers; layer >= 0; layer--) {
                const layerProgress = layer / layers;
                const layerRadius = baseRadius * (0.5 + 0.5 * layerProgress) * breathe;
                const layerAlpha = 0.1 + 0.15 * (1 - layerProgress);

                // Create morphing path
                ctx.beginPath();
                const points = 64;
                for (let i = 0; i <= points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    
                    // Multiple sine waves for organic morph
                    const morph1 = Math.sin(angle * 3 + time * 2) * morphIntensity;
                    const morph2 = Math.sin(angle * 5 - time * 1.5) * morphIntensity * 0.5;
                    const morph3 = Math.sin(angle * 7 + time * 3) * morphIntensity * 0.3;
                    const morph = morph1 + morph2 + morph3;
                    
                    const r = layerRadius * (1 + morph);
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();

                // Create gradient for this layer
                const gradient = ctx.createRadialGradient(
                    cx + Math.sin(time) * 20,
                    cy + Math.cos(time * 0.7) * 20,
                    0,
                    cx,
                    cy,
                    layerRadius * 1.2
                );

                // Rotating color stops
                const rotationOffset = time * 0.3 + layer * 0.5;
                const c1 = currentColors.primary;
                const c2 = currentColors.secondary;
                const c3 = currentColors.accent;

                gradient.addColorStop(0, rgb(c3, layerAlpha * 1.5));
                gradient.addColorStop(0.3, rgb(c2, layerAlpha));
                gradient.addColorStop(0.6, rgb(c1, layerAlpha * 0.8));
                gradient.addColorStop(1, rgb(c1, 0));

                ctx.fillStyle = gradient;
                ctx.fill();
            }

            // Core bright center
            const coreGradient = ctx.createRadialGradient(
                cx + Math.sin(time * 1.3) * 10,
                cy + Math.cos(time) * 10,
                0,
                cx,
                cy,
                baseRadius * 0.6
            );
            coreGradient.addColorStop(0, rgb(currentColors.accent, 0.9));
            coreGradient.addColorStop(0.3, rgb(currentColors.secondary, 0.5));
            coreGradient.addColorStop(0.7, rgb(currentColors.primary, 0.2));
            coreGradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.beginPath();
            ctx.arc(cx, cy, baseRadius * 0.5 * breathe, 0, Math.PI * 2);
            ctx.fillStyle = coreGradient;
            ctx.fill();

            // Inner glow ring
            ctx.beginPath();
            const ringRadius = baseRadius * 0.7 * breathe * (1 + amplitude * 0.2);
            ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
            ctx.strokeStyle = rgb(currentColors.accent, 0.3 + amplitude * 0.3);
            ctx.lineWidth = 2 + amplitude * 4;
            ctx.stroke();

            // Outer subtle ring
            ctx.beginPath();
            ctx.arc(cx, cy, baseRadius * breathe * (1 + amplitude * 0.1), 0, Math.PI * 2);
            ctx.strokeStyle = rgb(currentColors.primary, 0.15);
            ctx.lineWidth = 1;
            ctx.stroke();

            // Particles for extra life
            const particleCount = Math.floor(8 + amplitude * 12);
            for (let i = 0; i < particleCount; i++) {
                const particleAngle = (i / particleCount) * Math.PI * 2 + time * 0.5;
                const particleRadius = baseRadius * (0.8 + 0.4 * Math.sin(time * 2 + i));
                const px = cx + Math.cos(particleAngle) * particleRadius;
                const py = cy + Math.sin(particleAngle) * particleRadius;
                const particleSize = 1 + amplitude * 3;
                
                ctx.beginPath();
                ctx.arc(px, py, particleSize, 0, Math.PI * 2);
                ctx.fillStyle = rgb(currentColors.accent, 0.3 + amplitude * 0.4);
                ctx.fill();
            }

            // Continue animation
            if (!prefersReducedMotion) {
                animationId = requestAnimationFrame(drawOrb);
            }
        }

        // Draw static orb for reduced motion
        function drawStaticOrb() {
            ctx.clearRect(0, 0, size, size);
            const cx = size / 2;
            const cy = size / 2;
            const radius = size * 0.38;

            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
            gradient.addColorStop(0, rgb(currentColors.accent, 0.9));
            gradient.addColorStop(0.5, rgb(currentColors.secondary, 0.5));
            gradient.addColorStop(1, rgb(currentColors.primary, 0.3));

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Update state cycling (demo mode)
        function cycleStates() {
            if (useMic) return; // Don't auto-cycle when mic is active

            stateTimer += 16; // ~60fps
            if (stateTimer >= stateCycleDuration) {
                stateTimer = 0;
                const currentIndex = states.indexOf(currentState);
                const nextIndex = (currentIndex + 1) % states.length;
                setOrbState(states[nextIndex]);
            }
        }

        // Set orb state
        function setOrbState(state) {
            currentState = state;
            stateChip.dataset.state = state;
            stateChip.querySelector('.state-label').textContent = stateLabels[state];
        }

        // Switch persona
        function switchPersona(mode) {
            if (mode === currentPersona) return;

            currentPersona = mode;
            const persona = personas[mode];

            // Update target colors
            targetColors = { ...persona.colors };

            // Update glow
            orbGlow.style.background = `radial-gradient(circle at center, ${persona.colors.glow} 0%, transparent 70%)`;

            // Update info panel
            personaName.textContent = persona.name;
            personaRole.textContent = persona.role;
            personaDesc.textContent = persona.desc;

            // Update mode buttons
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // Update product locks
            productLocks.forEach(lock => {
                lock.classList.toggle('active', lock.dataset.product === persona.product);
            });

            // Reset state cycle
            stateTimer = 0;
            setOrbState('idle');
        }

        // Initialize microphone
        async function initMicrophone() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(micStream);
                source.connect(analyser);
                useMic = true;
                talkBtn.classList.add('active');
                setOrbState('listening');
            } catch (err) {
                console.log('Microphone access denied, using simulated amplitude');
                useMic = false;
            }
        }

        // Stop microphone
        function stopMicrophone() {
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
            }
            useMic = false;
            talkBtn.classList.remove('active');
            setOrbState('idle');
        }

        // Event listeners
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => switchPersona(btn.dataset.mode));
        });

        talkBtn.addEventListener('click', () => {
            if (useMic) {
                stopMicrophone();
            } else {
                initMicrophone();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') switchPersona('mira');
            if (e.key === '2') switchPersona('healix');
            if (e.key === '3') switchPersona('aria');
        });

        // Animation loop with state cycling
        function mainLoop(timestamp) {
            cycleStates();
            if (!prefersReducedMotion) {
                requestAnimationFrame(mainLoop);
            }
        }

        // Start
        if (prefersReducedMotion) {
            drawStaticOrb();
        } else {
            drawOrb();
            mainLoop();
        }

    })();
    </script>
</body>
</html>
